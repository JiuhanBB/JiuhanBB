<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>文章管理 · 久寒包包</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script><script src="admin.js" defer></script></head><body>
<section class="login" id="login"><div class="login-art"><span>✦</span><h1>创作后台</h1><p>把今天的探索，写成明天还能找到的答案。</p></div><form id="login-form"><a href="index.html">← 返回博客</a><div class="mascot">九</div><h2>欢迎回来</h2><p>使用有该仓库 Contents 读写权限的 GitHub Fine-grained Token。</p><label>GitHub Token<input id="token" type="password" required placeholder="github_pat_..." autocomplete="current-password"></label><button>登录后台 <i data-lucide="log-in"></i></button><small>令牌只保存在当前浏览器会话，关闭标签页后清除。</small><div class="error" id="login-error"></div></form></section>
<main class="dashboard" id="dashboard" hidden><header><a class="brand" href="index.html"><b>九</b><span>创作后台</span></a><div><span id="user-name"></span><button class="icon" id="logout" title="退出"><i data-lucide="log-out"></i></button></div></header><div class="workspace"><aside><div class="aside-head"><strong>文章</strong><button id="new-post"><i data-lucide="plus"></i> 新建</button></div><div id="post-list"></div></aside><section class="editor"><div class="editor-head"><div><span id="save-state">未修改</span><h1 id="editor-title">选择一篇文章</h1></div><div><button class="danger" id="delete-post" disabled title="删除"><i data-lucide="trash-2"></i></button><button class="publish" id="publish" disabled><i data-lucide="cloud-upload"></i> 发布到博客</button></div></div><div class="fields" id="fields" hidden><div class="row"><label>标题<input id="title"></label><label>分类<select id="category"><option>随笔</option><option>Web</option><option>逆向</option><option>Android</option></select></label><label>日期<input id="date" type="date"></label></div><label>摘要<input id="summary" maxlength="100"></label><div class="mode-tabs"><button class="active" data-mode="write">Markdown</button><button data-mode="preview">预览</button></div><textarea id="content" spellcheck="false" placeholder="开始写作..."></textarea><article id="preview" hidden></article></div><div class="empty" id="editor-empty">从左侧选择文章，或创建一篇新文章。</div></section></div><div class="toast" id="toast"></div></main></body></html>
