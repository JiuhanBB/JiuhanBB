<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>文章管理 · 久寒包包</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-extra.css"><link rel="stylesheet" href="editor-tools.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script><script src="admin.js" defer></script><script src="editor-tools.js" defer></script><script src="admin-hosting.js" defer></script></head><body>
<section class="login" id="login"><div class="login-art"><span>✦</span><h1>创作后台</h1><p>把今天的探索，写成明天还能找到的答案。</p></div><form id="login-form"><a href="index.html">← 返回博客</a><div class="mascot">九</div><h2>欢迎回来</h2><p>哈昂~ 使用久寒的大令牌狠狠~验证人家吧❤️</p><label>GitHub Token<input id="token" type="password" required placeholder="github_pat_..." autocomplete="current-password"></label><button id="login-button">登录后台 <i data-lucide="log-in"></i></button><small>登录状态会保存在当前浏览器中，退出登录时清除。</small><div class="error" id="login-error"></div></form></section>
<main class="dashboard" id="dashboard" hidden><header><a class="brand" href="index.html"><b>九</b><span>创作后台</span></a><div><span id="user-name"></span><button class="icon" id="logout" title="退出"><i data-lucide="log-out"></i></button></div></header><div class="workspace"><aside><div class="aside-head"><strong>文章</strong><button id="new-post"><i data-lucide="plus"></i> 新建</button></div><div id="post-list"></div></aside><section class="editor"><div class="editor-head"><div><span id="save-state">未修改</span><h1 id="editor-title">选择一篇文章</h1></div><div><button class="danger" id="delete-post" disabled title="删除"><i data-lucide="trash-2"></i></button><button class="publish" id="publish" disabled><i data-lucide="cloud-upload"></i> 发布到博客</button></div></div><div class="fields" id="fields" hidden><div class="row"><label>标题<input id="title"></label><label>分类<span class="category-field"><select id="category"></select><button id="new-category" type="button" title="新增分类"><i data-lucide="plus"></i></button></span></label><label>日期<input id="date" type="date"></label></div><label>摘要<input id="summary" maxlength="100"></label>
<div class="editor-toolbar"><div class="mode-tabs"><button class="active" data-mode="write">Markdown</button><button data-mode="preview">预览</button></div><div class="media-tools"><button id="upload-image" type="button"><i data-lucide="image"></i> 图片</button><button id="upload-file" type="button"><i data-lucide="paperclip"></i> 文件</button><button id="open-image-host" type="button" hidden></button><button id="insert-image-url" type="button" hidden></button></div></div>
<div class="markdown-toolbar" id="markdown-toolbar" aria-label="Markdown 格式工具"><button data-command="bold" title="粗体"><i data-lucide="bold"></i></button><button data-command="italic" title="斜体"><i data-lucide="italic"></i></button><button data-command="heading" title="二级标题"><i data-lucide="heading-2"></i></button><button data-command="paragraph" title="新段落"><i data-lucide="pilcrow"></i></button><span></span><button data-command="bullet" title="分点列表"><i data-lucide="list"></i></button><button data-command="ordered" title="编号列表"><i data-lucide="list-ordered"></i></button><button data-command="quote" title="引用"><i data-lucide="text-quote"></i></button><button data-command="code" title="代码块"><i data-lucide="square-code"></i></button><button data-command="link" title="链接"><i data-lucide="link-2"></i></button><button data-command="divider" title="分隔线"><i data-lucide="minus"></i></button><span></span><button data-command="template" title="插入整篇文章模板"><i data-lucide="layout-template"></i></button></div>
<textarea id="content" spellcheck="false" placeholder="开始写作..."></textarea><article id="preview" hidden></article></div><div class="empty" id="editor-empty">从左侧选择文章，或创建一篇新文章。</div></section></div><div class="toast" id="toast"></div></main>
<section class="upload-modal" id="upload-modal" hidden role="dialog" aria-modal="true" aria-labelledby="upload-title"><div class="upload-panel"><button class="upload-close" id="upload-close" type="button" title="关闭"><i data-lucide="x"></i></button><span class="mini-label">UPLOAD</span><h2 id="upload-title">上传图片</h2><div class="drop-zone" id="drop-zone" tabindex="0"><i data-lucide="cloud-upload"></i><strong id="drop-title">拖动图片到这里</strong><span>或点击选择</span><input id="file-input" type="file" hidden></div><div class="upload-status" id="upload-status" hidden><i data-lucide="loader-circle"></i><div><strong id="upload-status-title">正在上传</strong><span id="upload-status-detail">准备文件...</span></div></div><p id="upload-note">上传成功后会自动插入文章。</p></div></section>
</body></html>
